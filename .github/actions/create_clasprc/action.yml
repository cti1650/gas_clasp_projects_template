name: "Clasp Init"
description: "Clasp Init Action"

# NOTE: access_token / id_token は受け取らない。
# clasp (google-auth-library UserRefreshClient) が認証に使うのは
# client_id / client_secret / refresh_token の3つだけで、
# access_token は expiry_date: 0 により起動直後に必ず捨てられ、
# id_token は clasp 側で「リフレッシュ結果の保存先」としてしか参照されないため、
# どちらもリフレッシュ時に Google から自動で再取得される。
inputs:
  refresh_token:
    description: "User Refresh Token"
    required: true
  client_id:
    description: "User Client ID"
    required: true
  client_secret:
    description: "User Client Secret"
    required: true

runs:
  using: "composite"
  steps:
    - name: Check Push Secrets
      env:
        REFRESH_TOKEN: ${{ inputs.refresh_token }}
        CLIENT_ID: ${{ inputs.client_id }}
        CLIENT_SECRET: ${{ inputs.client_secret }}
      run: |
        # required: true は composite action では実行時に強制されないため、ここで明示的に検証する
        missing=()
        [ -z "$REFRESH_TOKEN" ] && missing+=("REFRESH_TOKEN")
        [ -z "$CLIENT_ID" ] && missing+=("CLIENT_ID")
        [ -z "$CLIENT_SECRET" ] && missing+=("CLIENT_SECRET")

        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Missing required secrets for clasp auth: ${missing[*]}"
          exit 1
        fi
      shell: bash

    - name: Generate ~/.clasprc.json
      env:
        REFRESH_TOKEN: ${{ inputs.refresh_token }}
        CLIENT_ID: ${{ inputs.client_id }}
        CLIENT_SECRET: ${{ inputs.client_secret }}
      run: |
        if ! command -v jq > /dev/null; then
          echo "::error::jq is not installed"
          exit 1
        fi

        jq -n \
          --arg refreshToken "$REFRESH_TOKEN" \
          --arg clientId "$CLIENT_ID" \
          --arg clientSecret "$CLIENT_SECRET" \
          '{
            token: {
              refresh_token: $refreshToken,
              token_type: "Bearer",
              expiry_date: 0
            },
            oauth2ClientSettings: {
              clientId: $clientId,
              clientSecret: $clientSecret,
              redirectUri: "http://localhost"
            }
          }' > ~/.clasprc.json
        chmod 600 ~/.clasprc.json
      shell: bash
